server {
    listen 80;

    # tracker-top дев-контейнера — за тем же origin: кросс-портовые запросы
    # (localhost:8098 -> localhost:8355) Safari режет как local network,
    # XHR падает с status 0 «нет подключения к сети»
    location /topapi/ {
        proxy_pass http://host.docker.internal:8355/;
        proxy_set_header Host $host;
    }

    # дев-хук живёт в index.html, бутстрап — в /t.js: без no-cache Safari
    # держит их в эвристическом кэше, хук не исполняется, protocol остаётся
    # https (TLS-хендшейки в http-nginx) и бутстрап «не работает». Тот же
    # фикс, что на клоне lampa.0x3654.com
    location = /t.js                { root /usr/share/nginx/html; add_header Cache-Control "no-cache"; }
    location = /index.html          { root /usr/share/nginx/html; add_header Cache-Control "no-cache"; }
    location = /top.js              { root /usr/share/nginx/html; add_header Cache-Control "no-cache"; }
    location = /transmission-send.js { root /usr/share/nginx/html; add_header Cache-Control "no-cache"; }

    location / {
        root /usr/share/nginx/html;
    }
}
